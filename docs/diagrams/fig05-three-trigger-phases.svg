<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg" width="1000" height="210"><rect x="0" y="0" width="1000" height="210" fill="#ffffff"/><defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5F5E5A"/></marker></defs><rect x="10" y="20" width="310" height="150" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="165.0" y="74.4" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#26215C">Phase 1: Manual</text>
<text x="165.0" y="86.7" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#534AB7">A person runs each agent per service</text>
<text x="165.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#534AB7">/qa:plan payments</text>
<text x="165.0" y="111.3" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#534AB7">/qa:cases payments --api refund</text>
<text x="165.0" y="123.6" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#534AB7">/qa:run payments --env qa</text>
<polyline points="320,95 343,95" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah5)"/>
<rect x="345" y="20" width="310" height="150" rx="7" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="500.0" y="74.4" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#412402">Phase 2: Event-driven</text>
<text x="500.0" y="86.7" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#854F0B">user story moves to Ready for QA</text>
<text x="500.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#854F0B">spec or contract merged</text>
<text x="500.0" y="111.3" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#854F0B">deploy to QA environment</text>
<text x="500.0" y="123.6" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#854F0B">each event maps to an agent</text>
<polyline points="655,95 678,95" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah5)"/>
<rect x="680" y="20" width="310" height="150" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="835.0" y="74.4" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#0C447C">Phase 3: CI/CD</text>
<text x="835.0" y="86.7" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#185FA5">PR: run affected service suites</text>
<text x="835.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#185FA5">nightly: full regression</text>
<text x="835.0" y="111.3" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#185FA5">release gate: required pass rate</text>
<text x="835.0" y="123.6" font-family="Helvetica, Arial, sans-serif" font-size="9.3" text-anchor="middle" font-weight="normal" fill="#185FA5">executor report + optimizer after runs</text>
<text x="500" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#26215C" font-style="italic">Same agents and the same artifacts in every phase; only the trigger changes.</text></svg>